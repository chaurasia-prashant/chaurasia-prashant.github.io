<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vGyan - Authentication</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { visibility: hidden; } /* Prevent flickering */
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <h1>v<span>Gyan</span></h1>
            </div>

            <div id="login-form">
                <h2>Login</h2>
                <p>Welcome back to your learning journey</p>
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="loginUsername" placeholder="Username" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-auth">Login</button>
                </form>
                <p class="switch-auth">Don't have an account? <a href="#" id="showSignup">Sign Up</a></p>
            </div>

            <div id="signup-form" style="display: none;">
                <h2>Create Account</h2>
                <p>Start your journey with vGyan today</p>
                <form id="signupForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Email Address" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn-auth">Sign Up</button>
                </form>
                <p class="switch-auth">Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>

            <div id="auth-error" class="error-message"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import config from "./js/config.js";

        // Initialize Firebase
        const app = initializeApp(config.firebase);
        window.auth = getAuth(app);
        window.db = getFirestore(app);
    </script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
